# Server Configuration
server.port=8080

# Application Name
spring.application.name=VenueVista Backend

# =======================================================
# OPTION A: H2 In-Memory Database (Disabled)
# =======================================================
# spring.datasource.url=jdbc:h2:mem:venuevista_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# spring.datasource.driver-class-name=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# =======================================================
# OPTION B: MySQL Database Configuration (Active)
# =======================================================
spring.datasource.url=jdbc:mysql://localhost:3306/venuevista_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
